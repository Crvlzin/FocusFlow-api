server:
  port: 8080

spring:
  application:
    name: focusflow-api

  datasource:
    url: jdbc:postgresql://localhost:5432/focusflow_db
    username: postgres
    password: password123
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

api:
  security:
    token:
      secret: ""
      expiration-hours: 24
