services:
  postgres:
    image: postgres:16-alpine
    container_name: focusflow-postgres-prod
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-focusflow_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-focusflow_secure_password_change_me}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - focusflow-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d focusflow_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: focusflow-api-prod
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-focusflow_db}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-focusflow_secure_password_change_me}
      API_SECURITY_TOKEN_SECRET: ${API_SECURITY_TOKEN_SECRET:-focusflow_jwt_secret_must_be_set_in_production_32chars}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,https://focusflow.vercel.app}
    networks:
      - focusflow-network

volumes:
  postgres_data:

networks:
  focusflow-network:
    driver: bridge
